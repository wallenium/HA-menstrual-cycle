name: Lint

# Dead code only (unused imports and variables, `raise` in `except` without `from`); the rules are in ruff.toml.
# Add rules there one at a time. The version is pinned so a new Ruff release cannot turn the check red on its own.

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: this job only reads the repository.
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run Ruff
        run: |
          python -m pip install ruff==0.16.9
          ruff check .
