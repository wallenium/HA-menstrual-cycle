name: HACSTest

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hacstest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint homeassistant

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 custom_components/menstruation_cycle --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 custom_components/menstruation_cycle --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint with pylint
        continue-on-error: true
        run: |
          pylint custom_components/menstruation_cycle --disable=all --enable=E,F
