name: Hassfest

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
