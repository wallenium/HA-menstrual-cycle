name: Real Home Assistant

# Runs the integration inside a real Home Assistant core (tools/real_ha), not against stubs.
# The unit tests in hacstest.yml stay the fast first line; this catches what only a real core shows
# (entity IDs, service schemas, storage upgrades, unload, who may read what).

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly: a new Home Assistant release can break the integration without any commit here
    - cron: "17 5 * * 1"

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minimum supported version (manifest/hacs.json) and the newest release the test plugin supports
        ha: ["2026.3.4", ""]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the upgrade test needs the release tags

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run the tests against Home Assistant ${{ matrix.ha || 'latest' }}
        run: bash tools/real_ha/run.sh ${{ matrix.ha }}

      - name: Upgrade from the previous release to this code
        run: bash tools/real_ha/upgrade_from_tag.sh "" ${{ matrix.ha }}

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python for Playwright
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Open the panel and all cards in Chromium
        run: bash tools/real_ha/browser.sh
        env:
          PLAYWRIGHT_PYTHON: python
